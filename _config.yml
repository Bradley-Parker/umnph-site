# ==============================================================================
# UMNPH - Website Configuration
# ==============================================================================
# Welcome! This file controls the content and settings of your website.
# You can easily edit any of the fields below without writing any code.
# Changes will automatically update on your GitHub Pages site when committed.
# ==============================================================================

# --- Organization Details ---
title: "UMNPH"
organization_name: "UMNPH Community Initiative"
badge: "Local Non-Profit Organization"
tagline: "Connecting neighbors, fostering community, and creating lasting local impact."
description: "We are a community-led non-profit dedicated to supporting local families, strengthening community ties, and providing resources where they are needed most."

# --- Status / Announcement Banner ---
# Shows a gentle pill badge above the title to let visitors know the site is active
status_badge: "Official Organization Site • Full Website Launching Soon"

# --- Contact & Location Details ---
# Fill these in with your organization's info, or leave blank ("") to hide
email: "info@umnph.org"
phone: "(555) 012-3456"
location: "Twin Cities & Surrounding Communities, MN"
hours: "Monday – Friday: 9am – 5pm"

# --- Action Buttons ---
primary_button:
  enabled: true
  text: "Get in Touch"
  url: "mailto:info@umnph.org"
  type: "email"

secondary_button:
  enabled: true
  text: "Learn More"
  url: "#details"
  type: "scroll"

# --- Social Media Profiles ---
# Add your handles/URLs here, or leave as "" to omit them from the footer/cards
social:
  facebook: "https://facebook.com"
  instagram: "https://instagram.com"
  linkedin: "https://linkedin.com"
  email: "info@umnph.org"

# --- Media & Assets ---
hero_image: "assets/images/hero.jpg"

# --- GitHub Pages / Jekyll Settings ---
# Jekyll automatically handles baseurl on GitHub Pages with the | relative_url filter.
baseurl: ""
url: ""
markdown: kramdown
permalink: pretty
exclude:
  - preview.py
  - preview.html
