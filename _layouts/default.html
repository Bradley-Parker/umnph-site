<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- Primary Meta Tags -->
  <title>{{ site.title }} - {{ site.organization_name }}</title>
  <meta name="title" content="{{ site.title }} - {{ site.organization_name }}">
  <meta name="description" content="{{ site.description }}">

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:title" content="{{ site.title }} - {{ site.organization_name }}">
  <meta property="og:description" content="{{ site.description }}">
  {% if site.hero_image %}
  <meta property="og:image" content="{{ site.hero_image | relative_url }}">
  {% endif %}

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{ site.url }}{{ site.baseurl }}/">
  <meta property="twitter:title" content="{{ site.title }} - {{ site.organization_name }}">
  <meta property="twitter:description" content="{{ site.description }}">
  {% if site.hero_image %}
  <meta property="twitter:image" content="{{ site.hero_image | relative_url }}">
  {% endif %}

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Modern SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310b981'/%3E%3Cpath d='M16 8c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8zm-1 12.5v-3.5h-3.5v-2h3.5v-3.5h2v3.5h3.5v2h-3.5v3.5h-2z' fill='%23ffffff'/%3E%3C/svg%3E">
</head>
<body>
  {{ content }}
</body>
</html>
